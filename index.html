<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Campus Lost & Found Portal</h1>
        <p>Report lost belongings or return items found on campus.</p>
        <div class="action-buttons">
            <button id="showLostFormBtn">Report Lost Item</button>
            <button id="showFoundFormBtn">Report Found Item</button>
        </div>
    </header>

    <!-- Report Item Form Container -->
    <div id="formContainer" class="form-container">
        <h2 id="formTitle">Report an Item</h2>
        <form id="itemForm">
            <!-- Hidden input to store whether item is Lost or Found -->
            <input type="hidden" id="itemType" value="Lost">

            <label for="itemName">Item Name:</label>
            <input type="text" id="itemName" placeholder="e.g., Blue Water Bottle, ID Card" required>

            <label for="category">Category:</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Electronics">Electronics</option>
                <option value="Personal Items">Personal Items</option>
                <option value="Books & Notes">Books & Notes</option>
                <option value="Cards & Wallet">Cards & Wallet</option>
                <option value="Other">Other</option>
            </select>

            <label for="location">Location:</label>
            <input type="text" id="location" placeholder="e.g., Library 2nd Floor, Canteen" required>

            <label for="date">Date:</label>
            <input type="date" id="date" required>
            <label for="itemImage">Upload Photo (Optional):</label>
            <input type="file" id="itemImage" accept="image/*">
            <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
                <img id="imagePreview" src="" alt="Preview" style="max-width: 100%; height: 120px; object-fit: cover; border-radius: 8px;">
            </div>

            <label for="description">Description:</label>
            <textarea id="description" placeholder="Provide extra details (color, marks, etc.)" required></textarea>

            <div class="form-actions">
                <button type="submit" class="submit-btn">Submit Report</button>
                <button type="button" id="closeFormBtn" class="cancel-btn">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Filter & Search Bar -->
    <section class="controls-section">
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Items</button>
            <button class="filter-btn" data-filter="Lost">Lost Items</button>
            <button class="filter-btn" data-filter="Found">Found Items</button>
        </div>
        <input type="text" id="searchInput" placeholder="Search items by name or location...">
    </section>

    <!-- Display Items Feed -->
    <main>
        <h2>Recent Reports</h2>
        <div id="itemsGrid" class="items-grid">
            <!-- Dynamic Cards Will Be Inserted Here by JavaScript -->
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
